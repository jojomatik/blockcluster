name: Smoke test Docker image
description: Check that the built container renders the homepage without errors
inputs:
  image:
    description: Local Docker image ID to test
    required: true
runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
      with:
        node-version: "24"
        cache: npm
        cache-dependency-path: tests/smoke/package-lock.json
    - name: Install smoke test dependencies
      shell: bash
      run: npm ci --prefix tests/smoke --no-audit --no-fund
    - name: Install Chromium system dependencies
      shell: bash
      working-directory: tests/smoke
      run: npx playwright install-deps chromium
    - name: Install Chromium headless shell
      shell: bash
      working-directory: tests/smoke
      env:
        # Avoid the FFmpeg mirror whose DNS lookup fails before falling back here.
        PLAYWRIGHT_DOWNLOAD_HOST: https://cdn.playwright.dev
      run: npx playwright install --only-shell chromium
    - name: Prepare Paper server fixture
      shell: bash
      run: |
        server_dir="$RUNNER_TEMP/blockcluster-smoke-servers/paper-smoke"
        mkdir -p "$server_dir"
        project=$(curl -fsSL -H 'User-Agent: blockcluster-smoke-test' https://fill.papermc.io/v3/projects/paper)
        version=$(printf '%s' "$project" | jq -r '[.versions[] | .[] | select(test("-") | not)] | sort_by(split(".") | map(tonumber)) | last')
        builds=$(curl -fsSL -H 'User-Agent: blockcluster-smoke-test' "https://fill.papermc.io/v3/projects/paper/versions/$version/builds")
        jar_name=$(printf '%s' "$builds" | jq -r 'max_by(.time) | .downloads["server:default"].name')
        jar_url=$(printf '%s' "$builds" | jq -r 'max_by(.time) | .downloads["server:default"].url')
        curl -fsSL -H 'User-Agent: blockcluster-smoke-test' "$jar_url" -o "$server_dir/$jar_name"
        printf '%s\n' \
          'level-seed=' \
          'gamemode=survival' \
          'level-name=world' \
          'motd=Blockcluster smoke test' \
          'pvp=true' \
          'difficulty=easy' \
          'max-players=1' \
          'online-mode=false' \
          'view-distance=4' \
          'allow-nether=false' \
          'server-port=25565' \
          'hardcore=false' \
          'white-list=false' \
          'spawn-protection=0' > "$server_dir/server.properties"
        chmod -R a+rwX "$RUNNER_TEMP/blockcluster-smoke-servers"
    - name: Start container
      id: container
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
      run: >-
        docker run -d --name blockcluster-smoke
        -p 127.0.0.1:8081:8081
        -v "$RUNNER_TEMP/blockcluster-smoke-servers:/usr/games/blockcluster/servers"
        -e SERVER_PATH=servers
        "$IMAGE"
    - name: Wait for backend
      shell: bash
      run: |
        # Keep startup connection errors quiet; report the final error on timeout.
        for attempt in {1..30}; do
          if curl --fail --silent --show-error --max-time 3 http://127.0.0.1:8081/api/version > /dev/null 2> "$RUNNER_TEMP/blockcluster-readiness.log"; then
            exit 0
          fi
          sleep 2
        done
        cat "$RUNNER_TEMP/blockcluster-readiness.log" >&2
        exit 1
    - name: Check backend and homepage
      shell: bash
      run: npm --prefix tests/smoke test
    - name: Show container logs
      if: ${{ always() && steps.container.outcome != 'skipped' }}
      shell: bash
      run: docker logs blockcluster-smoke
    - name: Remove container
      if: ${{ always() && steps.container.outcome != 'skipped' }}
      shell: bash
      run: docker rm -f blockcluster-smoke
