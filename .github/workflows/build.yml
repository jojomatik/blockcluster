name: Build
on:
  push:
    branches: [updates, next]
  pull_request:
    branches: [main, beta, updates, next]

jobs:
  yarn_build_frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install frontend dependencies
        run: corepack yarn install --immutable
      - name: Build frontend
        run: corepack yarn build
      - name: Lint
        run: corepack yarn lint
  yarn_build_backend:
    name: Build backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: yarn
          cache-dependency-path: backend/yarn.lock

      - name: Install backend dependencies
        run: corepack yarn install --immutable
      - name: Link backend dependencies in `/common`
        run: ln -s ../backend/node_modules ../common/node_modules
      - name: Build backend
        run: corepack yarn build
  docker_build:
    name: Build docker image
    needs:
      - yarn_build_frontend
      - yarn_build_backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          push: false
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test Docker image
        uses: ./.github/actions/smoke-test
        with:
          image: ${{ steps.build.outputs.imageid }}
