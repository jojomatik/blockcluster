name: Chromatic
on:
  push:
    branches: ["*"]
  workflow_run:
    workflows: ["Dependabot PR Check"]
    types:
      - completed

jobs:
  chromatic:
    name: Build storybook and publish to chromatic
    runs-on: ubuntu-latest
    if: ${{ (github.event_name == 'push' && github.actor != 'dependabot[bot]') || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install frontend dependencies
        run: corepack yarn install --immutable
      - name: Build storybook and publish to chromatic
        uses: chromaui/action@882b4728513a3720bfcd27bd9ad1260c603c6090 # v18
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
